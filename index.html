<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celiac Disease AI Chat</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="app__title" data-i18n="title">Celiac Disease Assistant</div>
      <div class="header-controls">
        <div class="language-selector">
          <select id="language-select" aria-label="Select language">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </div>
        <div class="region-selector">
          <select id="region-select" aria-label="Select region">
            <option value="canada">Canada</option>
            <option value="usa">USA</option>
            <option value="europe">Europe</option>
          </select>
        </div>
      </div>
    </header>
    <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
      <!-- Messages render here -->
    </main>
    <aside class="sources-menu" id="sources-menu" aria-label="Information sources">
      <div class="sources-menu__header">
        <h3 class="sources-menu__title" data-i18n="sources-title">Sources</h3>
      </div>
      <div class="sources-menu__content" id="sources-content">
        <!-- Sources will be inserted here -->
      </div>
    </aside>
    <footer class="composer" role="form" aria-label="Message composer">
      <form id="composer-form">
        <button class="composer__action" type="button" id="clear-btn" data-i18n-title="clear" title="Clear conversation" aria-label="Clear conversation">↺</button>
        <textarea id="message-input" class="composer__input" rows="1" data-i18n-placeholder="input-placeholder" placeholder="Ask about Celiac Disease..." aria-label="Message"></textarea>
        <button class="composer__send" id="send-btn" type="submit" data-i18n="send-button" aria-label="Send">Send</button>
      </form>
    </footer>
  </div>
  <script src="assets/app.js"></script>
</body>
<style>
  /* Fallback minimal styles if CSS fails to load */
  body{margin:0;font-family:'Science Gothic',system-ui,-apple-system,sans-serif;background:#ffffff;color:#212529}
</style>
</html>
